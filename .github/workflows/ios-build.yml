name: iOS build validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-build.yml"
      - "app/**"
      - "ios/**"
      - "mobile/**"
      - "scripts/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.mobile.config.ts"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ios-build.yml"
      - "app/**"
      - "ios/**"
      - "mobile/**"
      - "scripts/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.mobile.config.ts"

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Verify Xcode
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | awk 'NR == 1 { split($2, version, "."); print version[1] }')" -ge 26

      - name: Install dependencies
        run: npm ci

      - name: Sync native web assets
        run: npm run mobile:sync

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v7
        with:
          name: qrlab-ios-simulator-app
          path: ios-build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
